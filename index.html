<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy policies for DKSoft apps.">
  <title>DKSoft Privacy</title>
  <style>
    :root { color-scheme: light dark; --navy: #0b1d3a; --amber: #ffc13d; --paper: #f7f8fb; --ink: #172033; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
    header { background: var(--navy); color: white; padding: 3.5rem 1.25rem; }
    header div, main { width: min(720px, 100%); margin: auto; }
    h1 { margin: 0 0 .35rem; line-height: 1.15; }
    header p { margin: 0; color: #d7dfef; }
    main { padding: 2.5rem 1.25rem 4rem; }
    a { color: #2454a6; }
    .card { display: block; padding: 1.15rem 1.25rem; border: 1px solid #d8deea; border-left: 5px solid var(--amber); border-radius: 12px; background: white; text-decoration: none; color: inherit; }
    .card strong { display: block; font-size: 1.1rem; }
    footer { margin-top: 2.5rem; color: #596273; font-size: .9rem; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #071326; --ink: #edf2fb; }
      .card { background: #0b1d3a; border-color: #253655; }
      a { color: #9bbcff; }
      footer { color: #aab5c8; }
    }
  </style>
</head>
<body>
  <header><div><h1>DKSoft Privacy</h1><p>Privacy information for DKSoft applications.</p></div></header>
  <main>
    <a class="card" href="mornings-left/"><strong>Mornings Left</strong><span>View the Mornings Left privacy policy</span></a>
    <footer>Questions? Contact <a href="mailto:support.dksoft@gmail.com">support.dksoft@gmail.com</a>.</footer>
  </main>
</body>
</html>
